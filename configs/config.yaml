# ChurnOps tunable configuration.
#
# Values here change *behaviour* (hyperparameters, split sizes, decision policy, monitoring
# thresholds) without code changes. The *feature contract* (column names, allowed category
# values) stays in src/config.py because the API's Pydantic schema is typed against it.
#
# Use another file:   CHURNOPS_CONFIG=configs/experiment.yaml python -m src.training.train
# Env vars still win for deployment settings (MLFLOW_TRACKING_URI, REGISTERED_MODEL_NAME, ...).

data:
  raw_url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
  random_state: 42
  test_size: 0.15
  valid_size: 0.15

features:
  version: v1

# Portfolio assumptions, NOT real telecom economics.
decision_policy:
  false_negative_cost: 5.0
  false_positive_cost: 1.0
  risk_low_upper: 0.30   # p < 0.30 -> low
  risk_high_lower: 0.60  # p > 0.60 -> high, otherwise medium

training:
  pr_auc_tolerance: 0.005      # candidates this close to the best PR-AUC are tie-broken by Brier
  explain_background_rows: 50  # rows stored with the model for /explain
  logreg:
    C: 1.0
    max_iter: 2000
    class_weight: null
  random_forest:
    n_estimators: 400
    min_samples_leaf: 5
    max_features: sqrt
  lightgbm_shared:             # applied to every LightGBM candidate
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
  lightgbm_grid:
    - {n_estimators: 300, learning_rate: 0.03, num_leaves: 15, min_child_samples: 40}
    - {n_estimators: 500, learning_rate: 0.02, num_leaves: 7, min_child_samples: 60}
    - {n_estimators: 200, learning_rate: 0.05, num_leaves: 31, min_child_samples: 20}
  calibration:
    method: sigmoid
    cv: 5
  quick:                       # `--quick` (CI): fewer, smaller candidates
    random_forest_n_estimators: 100
    lightgbm_grid_size: 1

monitoring:
  drift_share: 0.5             # dataset drift if >= 50% of features drift
  simulated_batch_size: 500
  performance:
    min_labelled: 50           # below this, live metrics are too noisy to report
    window: 1000               # most recent labelled predictions considered
    max_roc_auc_drop: 0.05     # degraded if live ROC-AUC < baseline test ROC-AUC - this
    max_f1_drop: 0.10

mlflow:
  experiment: churnops_training
  registered_model_name: churnops-model
  model_alias: champion
