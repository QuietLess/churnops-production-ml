name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unit, pipeline, API, integration)
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Train, build & smoke-test image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Reproduce the model from scratch (proves the train command works)
        run: |
          python -m src.data.download
          python -m src.training.train --quick
          python -m src.training.register --force
      - name: Build image
        run: docker build -t churnops-api:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 churnops-api:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/health; then break; fi; sleep 2
          done
          curl -fsS localhost:8000/health | grep '"model_loaded":true'
          curl -fsS -X POST localhost:8000/predict \
            -H 'content-type: application/json' \
            -d "$(python -c 'import json; from app.schemas import EXAMPLE_CUSTOMER as c; print(json.dumps(c))')" \
            | tee /dev/stderr | grep churn_probability
      - name: Container logs
        if: always()
        run: docker logs api || true
